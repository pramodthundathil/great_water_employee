{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#156B9E">
    <title>{% block title %}Login{% endblock %} — Great Waters</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/portal.css' %}?v=20261114f">
    <style>
        .auth-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            background-color: var(--gw-surface);
        }
        .auth-hero {
            flex: 1.2;
            background: linear-gradient(rgba(13, 77, 115, 0.92), rgba(13, 77, 115, 0.92)), url('https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&w=1600&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5rem;
            color: #FFFFFF;
        }
        .auth-hero h1 { font-weight: 700; letter-spacing: -0.01em; }
        .auth-hero-brand img {
            height: 48px;
            background: #FFFFFF;
            border-radius: var(--radius-sm);
            padding: 4px;
        }
        .auth-hero-brand .brand-word { font-size: 1.5rem; font-weight: 700; color: #FFFFFF; }
        .auth-hero-brand .brand-word span { color: #7FD3F2; }
        .auth-form-side {
            flex: 1;
            background: var(--gw-surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3.5rem;
            max-width: 560px;
        }
        .auth-form-side h2 { font-weight: 700; letter-spacing: -0.01em; color: var(--gw-dark); }
        .auth-form-side .input-group-text {
            background: var(--gw-surface);
            border-color: var(--gw-border);
            color: var(--gw-text-muted);
        }
        .auth-form-side .form-control { background: var(--gw-surface) !important; }
        .auth-form-side .btn-gw-primary { min-block-size: 46px; font-size: 0.95rem; }
        .auth-demo-chip {
            border: 1px solid var(--gw-border);
            background: var(--gw-surface);
            color: var(--gw-text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-sm);
        }
        .auth-demo-chip:hover {
            border-color: var(--gw-primary);
            color: var(--gw-primary);
            background: var(--gw-primary-light);
        }
        .auth-mobile-brand { display: none; }
        @media (max-width: 991.98px) {
            .auth-container { flex-direction: column; }
            .auth-hero { display: none; }
            .auth-mobile-brand {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 1.25rem 1.5rem 0;
            }
            .auth-mobile-brand img { height: 40px; width: 40px; object-fit: contain; border: 1px solid var(--gw-border); border-radius: var(--radius-sm); padding: 3px; }
            .auth-mobile-brand .brand-word { font-weight: 700; font-size: 1.1rem; color: var(--gw-dark); line-height: 1.1; }
            .auth-mobile-brand .brand-word span { color: var(--gw-primary); }
            .auth-mobile-brand small { display: block; color: var(--gw-text-secondary); font-size: 0.75rem; }
            .auth-form-side { max-width: 100%; padding: 2rem 1.5rem; justify-content: flex-start; flex: 1; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-mobile-brand">
            <img src="{% static 'img/logo.png' %}" alt="Great Waters logo">
            <div>
                <div class="brand-word">GREAT<span>WATERS</span></div>
                <small>Expenses &amp; Leave</small>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
