{# Branch ownership of a configuration record. Context: obj (with .branch and .can_edit). #}
<span class="gw-rule-chip"><i class="bi {% if obj.branch %}bi-geo-alt{% else %}bi-globe2{% endif %}" aria-hidden="true"></i> {{ obj.branch.name|default:"All branches" }}</span>
{% if not obj.can_edit %}<span class="gw-rule-chip" title="Organisation-wide settings can only be changed by users with access to all branches"><i class="bi bi-lock" aria-hidden="true"></i> View only</span>{% endif %}
